{{- $name := include "claude-agent.fullname" . }}
{{- if .Values.repo }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-github
  labels:
    {{- include "claude-agent.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ $name }}-github
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ $name }}/github
        property: token
{{- end }}
{{- if .Values.argocd.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-argocd
  labels:
    {{- include "claude-agent.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ $name }}-argocd
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: claude-agents/argocd
        property: token
{{- end }}
