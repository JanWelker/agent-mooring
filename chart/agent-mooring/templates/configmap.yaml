apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-mooring.fullname" . }}
  labels:
    {{- include "agent-mooring.labels" . | nindent 4 }}
data:
  managed-settings.json: |
    {{- include "agent-mooring.managedSettings" . | nindent 4 }}
  CLAUDE.md: |
    {{- .Values.claudeMd | nindent 4 }}
  {{- if .Values.appa.policy }}
  appa.toml: |
    {{- .Values.appa.policy | nindent 4 }}
  {{- end }}
  mcp.json: |
    {{- dict "mcpServers" .Values.mcpServers | toPrettyJson | nindent 4 }}
  authorized_keys: |
    {{- range .Values.ssh.authorizedKeys }}
    {{ . | trim }}
    {{- end }}
