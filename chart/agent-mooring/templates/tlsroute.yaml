apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: {{ include "agent-mooring.fullname" . }}
  labels:
    {{- include "agent-mooring.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.ssh.gateway.name }}
      namespace: {{ .Values.ssh.gateway.namespace }}
      sectionName: {{ .Values.ssh.gateway.sectionName }}
  hostnames:
    - {{ printf "%s.%s" .Values.session .Values.ssh.domain }}
  rules:
    - backendRefs:
        - name: {{ include "agent-mooring.fullname" . }}
          port: 2222
