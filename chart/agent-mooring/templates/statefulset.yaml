{{- $name := include "agent-mooring.fullname" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-mooring.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      {{- include "agent-mooring.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-mooring.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "agent-mooring.serviceAccountName" . }}
      automountServiceAccountToken: {{ ne .Values.kubernetes.access "none" }}
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Native sidecar: TLS from the Gateway's passthrough listener ends
        # here and goes on to sshd on loopback.
        - name: tls
          image: {{ include "agent-mooring.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          restartPolicy: Always
          command: ["/usr/bin/tini", "--", "/usr/local/bin/tls-proxy"]
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
          # Only at start: every TCP probe is a failed TLS handshake in the log.
          startupProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      containers:
        - name: agent
          image: {{ include "agent-mooring.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: AGENT_SESSION
              value: {{ .Values.session | quote }}
            - name: AGENT_REPOS
              value: {{ include "agent-mooring.repos" . | quote }}
            - name: AGENT_KUBERNETES_ACCESS
              value: {{ .Values.kubernetes.access | quote }}
            - name: AGENT_SKILLS_REPO
              value: {{ .Values.skills.repo | quote }}
            - name: AGENT_SKILLS_REF
              value: {{ .Values.skills.ref | quote }}
            - name: AGENT_APPA
              value: {{ .Values.appa.enabled | quote }}
            {{- if .Values.argocd.enabled }}
            - name: ARGOCD_SERVER
              value: {{ printf "%s:443" .Values.argocd.server | quote }}
            - name: ARGOCD_OPTS
              value: --grpc-web
            # The Gateway offers no ALPN; gRPC refuses TLS without it otherwise.
            - name: GRPC_ENFORCE_ALPN_ENABLED
              value: "false"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # sshd listens on 127.0.0.1:2223 only, out of reach of the kubelet's
          # TCP probes; the probes connect from inside the container.
          startupProbe:
            exec:
              command: ["bash", "-c", "</dev/tcp/127.0.0.1/2223"]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["bash", "-c", "</dev/tcp/127.0.0.1/2223"]
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["bash", "-c", "</dev/tcp/127.0.0.1/2223"]
            periodSeconds: 10
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                # Claude exits on SIGHUP and flushes the conversation, so
                # --continue picks it up after the restart.
                command: ["tmux", "kill-server"]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: tmp
              mountPath: /tmp
            - name: managed
              mountPath: /etc/claude-code
              readOnly: true
            - name: agent-config
              mountPath: /etc/agent-mooring
              readOnly: true
            {{- if include "agent-mooring.tokens" . }}
            # Files, not env: the kubelet updates them when the ExternalSecret
            # refreshes, and the gh, git and argocd wrappers read them per call.
            - name: tokens
              mountPath: /var/run/secrets/agent-mooring
              readOnly: true
            {{- end }}
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: {{ include "agent-mooring.claimName" . }}
        - name: tls
          secret:
            secretName: {{ include "agent-mooring.tlsSecretName" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
        - name: managed
          configMap:
            name: {{ $name }}
            items:
              - key: managed-settings.json
                path: managed-settings.json
              {{- if .Values.claudeMd }}
              - key: CLAUDE.md
                path: CLAUDE.md
              {{- end }}
        - name: agent-config
          configMap:
            name: {{ $name }}
            items:
              - key: authorized_keys
                path: authorized_keys
              - key: mcp.json
                path: mcp.json
              {{- if .Values.appa.policy }}
              - key: appa.toml
                path: appa.toml
              {{- end }}
        {{- if include "agent-mooring.tokens" . }}
        - name: tokens
          projected:
            defaultMode: 0440
            sources:
              {{- if include "agent-mooring.github" . }}
              - secret:
                  name: {{ $name }}-github
                  items:
                    - key: token
                      path: github-token
              {{- end }}
              {{- if .Values.argocd.enabled }}
              - secret:
                  name: {{ $name }}-argocd
                  items:
                    - key: token
                      path: argocd-token
              {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
