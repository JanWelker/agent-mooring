# -- Session name, a DNS label. Resources are named claude-<session>, the SSH
# host is <session>.<ssh.domain>, and Remote Control shows claude-<session>.
session: ""

# -- GitHub repositories (owner/name), each cloned once into $HOME/<name>. One
# PAT per session at kv/claude-<session>/github must cover all of them. Empty
# (with repo): no clone, no PAT, no GitHub egress.
repos: []

# -- Deprecated alias: appended to repos when set.
repo: ""

skills:
  # -- Shared skills repository (owner/name), cloned to ~/.claude/skills and
  # fast-forwarded on every start and session. Its root has the layout of
  # ~/.claude/skills. The session's PAT must cover it; setting it alone is
  # enough to get the PAT and GitHub egress.
  repo: ""
  # -- Branch to clone; a change is checked out on the next start.
  ref: main

image:
  repository: ghcr.io/janwelker/agent-mooring
  # -- Defaults to the chart's appVersion, the Claude Code version.
  tag: ""
  # -- Image manifest digest (sha256:...), appended to the tag. The release
  # workflow sets it in the packaged chart, so a re-pushed tag is re-pulled.
  digest: ""
  pullPolicy: IfNotPresent

kubernetes:
  # -- none: own ServiceAccount, no token. read: claude-reader. write: claude-writer.
  access: none

argocd:
  enabled: false
  server: argo-grpc.infra.k8s.wlkr.ch

ssh:
  # -- Public key lines for ~/.ssh/authorized_keys.
  authorizedKeys: []
  gateway:
    name: apps-gateway
    namespace: kube-system
    sectionName: ssh
  domain: ssh.wlkr.ch

tls:
  # -- A kubernetes.io/tls Secret in the release namespace to serve instead of
  # a per-session certificate, for example one *.<ssh.domain> wildcard shared
  # by every session. Keeps session names out of certificate transparency logs.
  existingSecret: ""
  # -- Issuer of the per-session certificate the TLS sidecar serves when
  # existingSecret is empty; the Gateway passes TLS through, so the pod
  # terminates it.
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  # -- The TLS sidecar image, a distroless build of cmd/tls-proxy.
  image:
    repository: ghcr.io/janwelker/agent-mooring-tls-proxy
    # -- Defaults to the chart's appVersion, like image.tag.
    tag: ""
    # -- Set by the release workflow in the packaged chart, like image.digest.
    digest: ""
    pullPolicy: IfNotPresent

acp:
  # -- Allow npm registry egress for ACP clients; claude-code-acp itself is in the image.
  enabled: false

appa:
  # -- Protect the main session with OpenAPPA: install its Claude Code plugin
  # on start and run Claude under clappa. Opens GitHub egress for the install.
  enabled: false
  # -- Root OpenAPPA policy (`appa.toml`), installed over `~/.config/appa/appa.toml`
  # on start when it loads; an invalid one keeps the current policy. Empty
  # leaves the policy on the PVC to `/appa-guide`.
  policy: ""

# -- User-scope MCP servers, merged into ~/.claude.json on start; a server
# removed here is removed there.
mcpServers: {}

# -- Extra egress: [{matchName: host, port: 443}] or [{matchPattern: "*.host", port: 443}].
extraEgressFQDNs: []

# -- Merged over the chart's default managed-settings.json.
settings: {}

# -- Managed CLAUDE.md (/etc/claude-code/CLAUDE.md) for every session in the pod.
claudeMd: ""

persistence:
  # -- Use this PVC instead of creating claude-<session>.
  existingClaim: ""
  size: 20Gi
  storageClass: rook-ceph-block

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    memory: 8Gi

secretStore:
  name: openbao
  kind: ClusterSecretStore

# -- Extra container env, as a list of EnvVar.
extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}
