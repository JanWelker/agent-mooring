---
# Builds the image and chart for every Claude Code release: the image tag is
# the Claude Code version, the chart's appVersion follows it, and the chart's
# patch version moves by one per publish.
name: Release

"on":
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Claude Code version to build (default the latest on npm)
        required: false
        default: ""
      force:
        description: Rebuild and publish a new chart even if the tag exists
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/janwelker/claude-agent
  CHART_REGISTRY: oci://ghcr.io/janwelker/charts
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.0

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - id: check
        env:
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
          REPO: ${{ github.repository }}
        run: |
          version="${INPUT_VERSION:-$(npm view @anthropic-ai/claude-code version)}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected version '$version'" >&2
            exit 1
          fi
          release=true
          if git ls-remote --exit-code --tags "https://github.com/${REPO}.git" "refs/tags/v${version}" >/dev/null; then
            release="${FORCE:-false}"
          fi
          echo "Claude Code ${version}: release=${release}" >> "$GITHUB_STEP_SUMMARY"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: CLAUDE_CODE_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint claude "${IMAGE}@${DIGEST}" --version | grep -F "$VERSION"
          docker run --rm --read-only --user 1000:1000 --tmpfs /tmp --tmpfs /home/agent:uid=1000,gid=1000 \
            "${IMAGE}@${DIGEST}" check

      - name: Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
          output: trivy.txt

      - name: Package and push the chart
        id: chart
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          base="$(yq '.version' chart/claude-agent/Chart.yaml)"
          minor="${base%.*}"
          last="$(git tag --list "chart-${minor}.*" --sort=-v:refname | head -n1)"
          if [ -n "$last" ]; then
            chart_version="${minor}.$(( ${last##*.} + 1 ))"
          else
            chart_version="$base"
          fi
          yq -i ".version = \"${chart_version}\" | .appVersion = \"${VERSION}\"" chart/claude-agent/Chart.yaml
          # Pin the packaged chart to the image just pushed: a forced release
          # re-pushes the same tag, which IfNotPresent nodes would never re-pull.
          yq -i ".image.digest = \"${DIGEST}\"" chart/claude-agent/values.yaml
          helm package chart/claude-agent -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/claude-agent-${chart_version}.tgz" "$CHART_REGISTRY"
          git checkout -- chart/claude-agent/Chart.yaml chart/claude-agent/values.yaml
          echo "version=${chart_version}" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "chart-${CHART_VERSION}"
          git push origin "chart-${CHART_VERSION}"
          {
            echo "Claude Code ${VERSION}."
            echo
            echo "| Artifact | Reference |"
            echo "| --- | --- |"
            echo "| Image | \`${IMAGE}:${VERSION}\` |"
            echo "| Image digest | \`${IMAGE}@${DIGEST}\` |"
            echo "| Chart | \`${CHART_REGISTRY}/claude-agent\` version \`${CHART_VERSION}\` |"
            echo
            echo "Changes in Claude Code: https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"
            if [ -s trivy.txt ]; then
              echo
              echo "<details><summary>Trivy: fixable HIGH and CRITICAL</summary>"
              echo
              echo '```'
              head -c 60000 trivy.txt
              echo '```'
              echo "</details>"
            fi
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release edit "v${VERSION}" --notes-file notes.md
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            gh release create "v${VERSION}" --title "Claude Code ${VERSION}" --notes-file notes.md --verify-tag
          fi
